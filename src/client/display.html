<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchuhr – Display</title>
<style>
  /* Display bleibt bewusst custom – vw/vh-basiert für TV/Beamer, designed
     against 1920×1080 as the reference resolution (scales proportionally
     to any other HD-class output). clamp(min-px, preferred-vw, max-px) is
     used on all text so low-resolution beamers still get a readable
     minimum size instead of pure vw scaling shrinking text below
     legibility.

     Light background is a deliberate choice, not a default: projectors
     can't produce true black, so in a normally-lit hall a dark theme's
     "black" reads as washed-out gray and contrast collapses. A light
     background actively emits near-maximum lumens and holds contrast
     against ambient light far better. (ADR-00XX)

     No outer frame/border/margin: the panel is full-bleed so it always
     fills exactly the beamer's negotiated resolution, regardless of its
     native aspect ratio — a bordered "card" inset by fixed vw/vh margins
     scaled inconsistently across different aspect ratios. */
  /* Self-hosted font: system fonts on the Pi (Raspberry Pi OS) don't
     reliably ship a true 900/Black weight under the name "Segoe UI" or
     "Arial Black" — the browser silently falls back to whatever generic
     sans-serif is installed, which is why score/team text rendered
     thinner than intended despite font-weight:900 in CSS. Bundling Inter
     (OFL-licensed, self-hosted, no internet needed) guarantees the actual
     weight is available regardless of what's installed on the kiosk. */
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/inter-latin-700-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url('/fonts/inter-latin-800-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 900;
    font-display: swap;
    src: url('/fonts/inter-latin-900-normal.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fdfdfb;
    color: #16181d;
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  .board-outer {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ── Phase-Header (oben) ── */
  .phase-row {
    height: 6vh;
    flex-shrink: 0;
    border-bottom: 0.15vh solid #e4e4e0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .phase-label { font-size: clamp(14px, 1.4vw, 28px); font-weight: 800; color: #6a6d75; letter-spacing: 3px; text-transform: uppercase; }
  .conn-dot {
    position: absolute;
    right: 3vw;
    width: 1.6vw;
    height: 0.3vh;
    min-height: 3px;
    border-radius: 2px;
    background: #ddd;
    transition: background 0.3s;
  }
  .conn-dot.connected { background: #00e676; }
  .conn-dot.disconnected { background: #ccc; }

  /* ── Uhr ──
     No pill background: the clock is the single most essential piece of
     info on the board, so it gets the same high-contrast dark-on-light
     treatment as everything else instead of being a small dark island
     that suffers the same ambient-light contrast loss the light theme
     was chosen to avoid in the first place. */
  .clock-row { flex-shrink: 0; display: flex; justify-content: center; padding-top: 2.4vh; }
  .clock-pill {
    color: #16181d;
    display: flex;
    align-items: center;
    gap: 0.8vw;
    font-size: clamp(34px, 3.8vw, 74px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .clock-pill.ended  { color: #c0392b; }
  .clock-pill.break  { color: #6c4fd6; }
  .status-dot { width: 0.9vw; height: 0.9vw; min-width: 10px; min-height: 10px; border-radius: 50%; background: #999; flex-shrink: 0; transition: background 0.3s; }
  .status-dot.running { background: #00b359; }
  .status-dot.timeout { background: #d68910; }
  .status-dot.stopped { background: #c0392b; }
  .status-dot.inactive { background: #b0b3ba; }

  /* ── Event-Zone: Timeout / Penalty-Schiessen ──
     Fixed height, always reserved (empty most of the time). */
  .event-row { height: 8vh; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .event-pill {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    border-radius: 999px;
    padding: 0.7vh 2vw;
    font-weight: 800;
  }
  .event-pill.timeout { background: #e3f7ea; color: #0f6e42; }
  .event-pill.shootout { background: #fbe8f1; color: #8a1252; }
  .event-label { font-size: clamp(14px, 1.5vw, 26px); text-transform: uppercase; letter-spacing: 2px; white-space: nowrap; }
  .event-detail { font-size: clamp(12px, 1.2vw, 20px); opacity: 0.8; white-space: nowrap; }
  .event-score { font-size: clamp(18px, 2vw, 34px); font-weight: 900; font-variant-numeric: tabular-nums; }

  /* ── Score ──
     Fills all the vertical space that's actually left over
     (flex:1; min-height:0) instead of a small fixed block being centered
     inside a much taller area. */
  .score-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 2.5vw 2vh; }
  .score-cluster { display: flex; align-items: center; gap: 1vw; }
  .team-name {
    font-size: clamp(26px, 3.1vw, 58px);
    font-weight: 800;
    letter-spacing: 1px;
    color: #16181d;
    text-transform: uppercase;
    /* ADR-0009: abbreviations up to 8 chars. max-width sized generously so
       a full 8-char abbreviation fits without triggering the ellipsis —
       the ellipsis below is a safety net for edge cases, not the norm. */
    max-width: 19vw;
    flex-shrink: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .wedge { width: 1.6vw; flex-shrink: 0; align-self: stretch; min-height: 8vh; clip-path: polygon(0 0, 100% 15%, 100% 85%, 0 100%); }
  .wedge.home { background: var(--home-color, #c0392b); }
  .wedge.away { background: var(--away-color, #2980b9); clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 85%); }

  /* Each digit slot is fixed-width (so team names/wedges never move), but
     the digit itself hugs the adjacent wedge instead of floating centered
     in dead space: home digit anchors right (against the home wedge),
     away digit anchors left (against the away wedge). Sized to comfortably
     fit up to "99" without reflowing at 1 digit. */
  .score-slot {
    width: 3ch;
    font-size: clamp(64px, 6.5vw, 210px);
    font-weight: 900;
    color: #16181d;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .score-slot.home { text-align: right; }
  .score-slot.away { text-align: left; }
  .score-sep { color: #b0b3ba; font-size: clamp(36px, 4vw, 120px); font-weight: 900; }

  /* ── Strafen — vier Spalten unter dem Score ──
     home slot (aussen links) | home badge | away badge | away slot
     (aussen rechts). Badge-Spalten hängen direkt neben der Team-Spalte,
     der sie gehören — kein Vermischen der beiden Teams in einer Liste,
     Zugehörigkeit ist durch Position sofort klar. Die beiden mittleren
     Badge-Spalten sind auto-breit, die beiden äusseren flex:1 — dadurch
     sitzt das Badge-Paar automatisch zentriert. Ganze Zeile fix-höhig und
     reserviert, unabhängig von der Anzahl Strafen. A thin top border
     mirrors the divider under the phase header, separating this zone
     from the score above it. Font sizes are generous since jersey
     numbers are bounded at 2 digits (#99 max) — no need to size
     defensively for unpredictable content width. */
  .pen-strip { width: 100%; height: 15vh; flex-shrink: 0; display: flex; overflow: hidden; border-top: 0.15vh solid #e4e4e0; }
  .pen-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0.6vh; padding: 1vh 2vw 0; }
  .pen-zone-label { font-size: clamp(12px, 1.05vw, 18px); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #9a9da5; }
  .pen-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.7vw;
    background: #eef0f4;
    border-radius: 999px;
    padding: 0.5vh 1.1vw;
    font-size: clamp(18px, 1.7vw, 32px);
    font-weight: 800;
    color: #16181d;
    font-variant-numeric: tabular-nums;
  }
  .pen-chip .pen-rem { color: #c0392b; }
  .pen-chip.pen-waiting { opacity: 0.5; }

  /* Badge penalties (10' misconducts etc.) — one column per team, sitting
     directly beside that team's slot-penalty column. Slightly larger
     than the slot chips — they're rarer, more significant events — while
     staying inside the same reserved row. */
  .badge-zone { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0.6vh; padding: 1vh 1vw 0; min-width: 9vw; }
  .badge-zone.home { align-items: flex-end; }
  .badge-zone.away { align-items: flex-start; }
  .badge-chip {
    display: flex;
    align-items: center;
    gap: 0.7vw;
    background: #fdf0da;
    border-radius: 999px;
    padding: 0.6vh 1.2vw;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .badge-chip.pen-waiting { opacity: 0.5; }
  .badge-num { font-size: clamp(19px, 1.8vw, 34px); color: #16181d; }
  .badge-label { font-size: clamp(19px, 1.8vw, 34px); color: #7a4a06; }

  /* ── Ended-Banner ── */
  .ended-banner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(22,24,29,0.88);
    color: #fdcb6e;
    border-radius: 16px;
    padding: 2vh 4vw;
    font-size: clamp(40px, 5.5vw, 110px); font-weight: 900;
    animation: pulse 1.2s infinite;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ── Audio-Unlock-Hint ──
     Non-blocking, small corner in the lower right; appears only if the
     browser has actually blocked the horn sound (autoplay policy).
     Disappears permanently after the first click anywhere on the page.  */
  .audio-hint {
    position: fixed;
    bottom: 2vh;
    right: 2vw;
    background: rgba(22,24,29,0.85);
    color: #fdcb6e;
    border-radius: 999px;
    padding: 1vh 2vw;
    font-size: clamp(14px, 1.3vw, 22px);
    font-weight: 700;
    cursor: pointer;
    z-index: 20;
    animation: pulse 1.6s infinite;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./display.ts"></script>
</body>
</html>
